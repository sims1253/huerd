<body>
<div id="scene"></div>

<div class="panel" id="controls">
  <h1>PALETTE MANIFOLD</h1>
  <div class="sub">__NDRAWS__ posterior draws &middot; huerd / Stan-style HMC__VARIANT__</div>

<script>/*__THREE__*/</script>
<script>/*__ORBIT__*/</script>
<script>
let DATA = /*__DATA__*/;
// (let: the Shiny palette-studio app replaces the sample at runtime)

// ---------------------------------------------------------------- helpers
const METRICS = ["min_dist", "cvd_safe", "min_deutan", "min_protan",
  "min_tritan", "mean_chroma", "lightness_spread"];
const PC_NAMES = ["pc1", "pc2", "pc3"];
const AXES = METRICS.concat(PC_NAMES, ["score"]);
const AXIS_LABEL = {
  min_dist: "min dist (normal)", cvd_safe: "CVD-safe dist",
  min_deutan: "deutan min", min_protan: "protan min", min_tritan: "tritan min",
  mean_chroma: "mean chroma", lightness_spread: "L spread",
  pc1: "PC1", pc2: "PC2", pc3: "PC3", score: "weighted score"
};
const WEIGHTED = ["cvd_safe", "min_dist", "mean_chroma", "lightness_spread"];
const W_DEFAULT = { cvd_safe: 2, min_dist: 1, mean_chroma: 1, lightness_spread: 0.5 };

const clamp01 = v => Math.max(0, Math.min(1, v));
function rescale01(arr) {
  let lo = Infinity, hi = -Infinity;
  for (const v of arr) { if (v < lo) lo = v; if (v > hi) hi = v; }
  const span = hi - lo < 1e-12 ? 1 : hi - lo;
  return arr.map(v => (v - lo) / span);
}
// magma-like ramp: t in [0,1] -> rgb
function magma(t) {
  t = clamp01(t);
  const stops = [
    [0.000, [23, 2, 51]], [0.25, [85, 15, 109]], [0.50, [188, 55, 84]],
    [0.75, [249, 133, 50]], [1.000, [246, 232, 110]]
  ];
  let a = stops[0], b = stops[stops.length - 1];
  for (let i = 0; i < stops.length - 1; i++) {
    if (t >= stops[i][0] && t <= stops[i + 1][0]) { a = stops[i]; b = stops[i + 1]; break; }
  }
  const f = (t - a[0]) / Math.max(1e-9, b[0] - a[0]);
  return [0, 1, 2].map(i => a[1][i] + f * (b[1][i] - a[1][i]));
}

// ---------------------------------------------------------------- scoring
let N = DATA.length;
const scaledCache = {};
function scaled(metric) {
  if (metric === "score") return Array.from(scores()); // live: depends on weights
  if (!(metric in scaledCache)) scaledCache[metric] = rescale01(DATA.map(d => d[metric]));
  return scaledCache[metric];
}
let weights = Object.assign({}, W_DEFAULT);
let rawScoreRange = [0, 1];
function scores() {
  const s = new Float64Array(N);
  let wsum = 0;
  for (const m of WEIGHTED) wsum += weights[m];
  if (wsum <= 0) { weights = Object.assign({}, W_DEFAULT); wsum = 1; for (const m of WEIGHTED) wsum += weights[m]; }
  for (const m of WEIGHTED) {
    if (weights[m] === 0) continue;
    const z = scaled(m);
    for (let i = 0; i < N; i++) s[i] += weights[m] * z[i];
  }
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < N; i++) { if (s[i] < lo) lo = s[i]; if (s[i] > hi) hi = s[i]; }
  rawScoreRange = [lo, hi];
  const span = hi - lo < 1e-12 ? 1 : hi - lo;
  for (let i = 0; i < N; i++) s[i] = (s[i] - lo) / span;
  return s;
}

// Pareto front over the four weighted metrics (all maximized): draws that
// no other draw weakly dominates. Independent of weights; recomputed
// whenever the sample is replaced.
let PARETO = [];
function computePareto() {
  PARETO = [];
  const cols = WEIGHTED.map(m => DATA.map(d => d[m]));
  for (let i = 0; i < N; i++) {
    let dominated = false;
    for (let j = 0; j < N && !dominated; j++) {
      if (j === i) continue;
      let ge = true, gt = false;
      for (let k = 0; k < cols.length; k++) {
        if (cols[k][j] < cols[k][i]) { ge = false; break; }
        if (cols[k][j] > cols[k][i]) gt = true;
      }
      dominated = ge && gt;
    }
    if (!dominated) PARETO.push(i);
  }
}

// ---------------------------------------------------------------- scene
const container = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d12);
scene.fog = new THREE.Fog(0x0b0d12, 6, 18);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 100);
camera.position.set(2.6, 1.8, 3.2);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;

scene.add(new THREE.AmbientLight(0x8899bb, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 0.7);
key.position.set(2, 4, 2);
scene.add(key);

// glowing dot sprite texture
function dotTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 64;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, "rgba(255,255,255,1)");
  grad.addColorStop(0.35, "rgba(255,255,255,0.9)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

const sprite = dotTexture();
const material = new THREE.PointsMaterial({
  size: 0.075, map: sprite, vertexColors: true, transparent: true,
  depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
});

// stroked-ring sprite texture for Pareto markers and the selection spotlight
function ringTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 64;
  const g = c.getContext("2d");
  g.strokeStyle = "rgba(255,255,255,1)";
  g.lineWidth = 5;
  g.beginPath();
  g.arc(32, 32, 24, 0, 2 * Math.PI);
  g.stroke();
  return new THREE.CanvasTexture(c);
}

const paretoMaterial = new THREE.PointsMaterial({
  size: 0.15, map: ringTexture(), color: 0xffffff, transparent: true,
  opacity: 0.55, depthWrite: false, sizeAttenuation: true
});

// buffers sized to the current sample; rebuilt by loadData() when the
// Shiny studio app streams in a fresh posterior
let geometry, positions, colors, points;
let paretoGeo, paretoPts;
function rebuildCloud() {
  if (points) { scene.remove(points); geometry.dispose(); }
  if (paretoPts) { scene.remove(paretoPts); paretoGeo.dispose(); }
  positions = new Float32Array(N * 3);
  colors = new Float32Array(N * 3);
  geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  points = new THREE.Points(geometry, material);
  scene.add(points);
  paretoGeo = new THREE.BufferGeometry();
  paretoGeo.setAttribute("position",
    new THREE.BufferAttribute(new Float32Array(PARETO.length * 3), 3));
  paretoPts = new THREE.Points(paretoGeo, paretoMaterial);
  scene.add(paretoPts);
}
function syncPareto() {
  const p = paretoGeo.attributes.position.array;
  for (let k = 0; k < PARETO.length; k++) {
    const j = PARETO[k] * 3;
    p[k * 3] = positions[j];
    p[k * 3 + 1] = positions[j + 1];
    p[k * 3 + 2] = positions[j + 2];
  }
  paretoGeo.attributes.position.needsUpdate = true;
}

const spotRing = new THREE.Sprite(new THREE.SpriteMaterial({
  map: ringTexture(), color: 0xffd166, transparent: true, opacity: 0.95,
  depthTest: false
}));
spotRing.visible = false;
scene.add(spotRing);

// axis extent normalization to [-1, 1]
function normAxis(metric) {
  const z = scaled(metric);
  return z.map(v => v * 2 - 1);
}
let currentAxes = { x: "min_dist", y: "cvd_safe", z: "mean_chroma" };
let targets = new Float32Array(N * 3);
let froms = new Float32Array(N * 3);
let animT = 1;

function setAxes(axes, animate = true) {
  currentAxes = axes;
  const X = normAxis(axes.x), Y = normAxis(axes.y), Z = normAxis(axes.z);
  froms.set(positions);
  for (let i = 0; i < N; i++) {
    targets[i * 3] = X[i];
    targets[i * 3 + 1] = Y[i];
    targets[i * 3 + 2] = Z[i];
  }
  if (animate) animT = 0;
  else { positions.set(targets); animT = 1; }
  buildCarpet();
  layoutAxisLabels();
}

function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

function recolor() {
  const s = scores();
  for (let i = 0; i < N; i++) {
    const c = magma(0.16 + 0.84 * Math.pow(s[i], 1.25));
    let dim = 0.55 + 0.45 * s[i];
    if (!elig[i]) dim = 0.045;
    if (pinnedI >= 0 && i !== pinnedI) dim *= 0.3;
    colors[i * 3] = c[0] / 255 * dim;
    colors[i * 3 + 1] = c[1] / 255 * dim;
    colors[i * 3 + 2] = c[2] / 255 * dim;
  }
  geometry.attributes.color.needsUpdate = true;
  renderChips(s);
  document.getElementById("score-range").textContent =
    "weights: " + WEIGHTED.map((m, i) => weights[m].toFixed(1)).join(" / ");
  document.getElementById("s-lo").textContent = rawScoreRange[0].toFixed(2);
  document.getElementById("s-hi").textContent = rawScoreRange[1].toFixed(2);
  document.getElementById("elig-n").textContent = (function () {
    const cs = consSummary();
    return cs ? eligCount + " / " + N + " eligible \u00b7 " + cs
      : "all " + N + " eligible";
  })();
}

// ---------------------------------------------------------------- carpet
let carpet = null, carpetGrid = null;
function buildCarpet() {
  // 2D histogram over current X/Z axes, blurred -> density surface below cloud
  const W = 48;
  const grid = new Float32Array(W * W);
  const X = normAxis(currentAxes.x), Z = normAxis(currentAxes.z);
  for (let i = 0; i < N; i++) {
    const gx = Math.min(W - 1, Math.max(0, Math.round((X[i] + 1) / 2 * (W - 1))));
    const gz = Math.min(W - 1, Math.max(0, Math.round((Z[i] + 1) / 2 * (W - 1))));
    grid[gz * W + gx] += 1;
  }
  // separable box blur x3 (approx gaussian)
  for (let pass = 0; pass < 3; pass++) {
    const tmp = new Float32Array(W * W);
    for (let r = 0; r < W; r++) for (let c = 0; c < W; c++) {
      let s = 0, k = 0;
      for (let d = -2; d <= 2; d++) { const cc = c + d; if (cc >= 0 && cc < W) { s += grid[r * W + cc]; k++; } }
      tmp[r * W + c] = s / k;
    }
    for (let r = 0; r < W; r++) for (let c = 0; c < W; c++) {
      let s = 0, k = 0;
      for (let d = -2; d <= 2; d++) { const rr = r + d; if (rr >= 0 && rr < W) { s += tmp[rr * W + c]; k++; } }
      grid[r * W + c] = s / k;
    }
  }
  let mx = 0;
  for (const v of grid) mx = Math.max(mx, v);
  for (let i = 0; i < grid.length; i++) grid[i] /= mx;
  carpetGrid = grid;

  if (carpet) { scene.remove(carpet); carpet.geometry.dispose(); }
  const geo = new THREE.PlaneGeometry(2.6, 2.6, W - 1, W - 1);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const cols = new Float32Array(pos.count * 3);
  for (let r = 0; r < W; r++) for (let c = 0; c < W; c++) {
    const idx = r * W + c + 0; // vertex ordering: rows
    const v = pos.getX(r * W + c), h = grid[r * W + c];
    pos.setY(r * W + c, -1.35 + h * 0.5);
    const t = h;
    cols[(r * W + c) * 3] = 0.10 + 0.25 * t;
    cols[(r * W + c) * 3 + 1] = 0.16 + 0.38 * t;
    cols[(r * W + c) * 3 + 2] = 0.28 + 0.55 * t;
  }
  geo.setAttribute("color", new THREE.BufferAttribute(cols, 3));
  const mat = new THREE.MeshBasicMaterial({
    vertexColors: true, wireframe: true, transparent: true, opacity: 0.30
  });
  carpet = new THREE.Mesh(geo, mat);
  scene.add(carpet);
}

// ---------------------------------------------------------------- labels
// DOM overlays projected from 3D anchors: crisp at any zoom, rename
// freely, and are assertable in the self-test (canvas sprites were none
// of those).
const axEls = {};
for (const dim of ["x", "y", "z"]) {
  const el = document.createElement("div");
  el.className = "axlabel";
  container.appendChild(el);
  axEls[dim] = el;
}
const AX_ANCHOR = {
  x: new THREE.Vector3(1.18, -1.28, 0),
  z: new THREE.Vector3(0, -1.28, 1.18),
  y: new THREE.Vector3(-1.12, 0.42, -1.12)
};
const AX_DIR = {
  x: new THREE.Vector3(1, 0, 0),
  y: new THREE.Vector3(0, 1, 0),
  z: new THREE.Vector3(0, 0, 1)
};
function layoutAxisLabels() {
  // trailing arrow on X, leading on Y/Z; the arrow glyph is rotated to the
  // projected axis direction each frame (a screen-fixed arrow points the
  // wrong way once the camera goes behind/below the cloud)
  axEls.x.innerHTML = AXIS_LABEL[currentAxes.x] + ' <span class="arr">\u2192</span>';
  axEls.z.innerHTML = '<span class="arr">\u2192</span> ' + AXIS_LABEL[currentAxes.z];
  axEls.y.innerHTML = '<span class="arr">\u2192</span> ' + AXIS_LABEL[currentAxes.y];
}
const labelVec = new THREE.Vector3();
const labelVec2 = new THREE.Vector3();
function projectLabels() {
  for (const dim of ["x", "y", "z"]) {
    labelVec.copy(AX_ANCHOR[dim]).project(camera);
    const el = axEls[dim];
    if (labelVec.z > 1) { el.style.display = "none"; continue; }
    el.style.display = "block";
    el.style.left = ((labelVec.x * 0.5 + 0.5) * innerWidth) + "px";
    el.style.top = ((-labelVec.y * 0.5 + 0.5) * innerHeight) + "px";
    labelVec2.copy(AX_ANCHOR[dim]).add(AX_DIR[dim]).project(camera);
    const ang = Math.atan2(-(labelVec2.y - labelVec.y), labelVec2.x - labelVec.x);
    const arr = el.querySelector(".arr");
    if (arr) arr.style.transform = "rotate(" + ang + "rad)";
  }
}

// ---------------------------------------------------------------- ui
const sliders = document.getElementById("weight-sliders");
for (const m of WEIGHTED) {
  const row = document.createElement("div");
  row.className = "slider-row";
  row.innerHTML =
    "<label>" + m.replace(/_/g, " ") +
    ' <span class="val" id="wval-' + m + '">' + W_DEFAULT[m].toFixed(1) + "</span></label>" +
    '<input type="range" min="0" max="3" step="0.1" value="' + W_DEFAULT[m] +
    '" id="w-' + m + '">';
  sliders.appendChild(row);
  row.querySelector("input").addEventListener("input", e => {
    weights[m] = parseFloat(e.target.value);
    document.getElementById("wval-" + m).textContent = weights[m].toFixed(1);
    recolor();
    // a score axis moves when weights move: re-layout with animation
    if (["x", "y", "z"].some(d => currentAxes[d] === "score")) {
      setAxes(currentAxes, true);
    }
  });
}

// ---------------------------------------------------------------- constraints
// Hard conditions on proposed palettes, applied to the *existing* sample:
// ineligible draws fade out and leave the ranked list. (What the sample
// contains is decided at sampling time -- see the pastel-variant build,
// which re-samples with chroma/lightness targets in the log density.)
let chromaRange = [0, 1];
let Lrange = [0, 1];
const cons = { chromaMax: 1, Llo: 0, Lhi: 1 };
let elig = [];
let eligCount = 0;
function computeElig() {
  elig = new Array(N);
  eligCount = 0;
  for (let i = 0; i < N; i++) {
    const d = DATA[i];
    elig[i] = d.mean_chroma <= cons.chromaMax + 1e-9 &&
      d.mean_L >= cons.Llo - 1e-9 && d.mean_L <= cons.Lhi + 1e-9;
    if (elig[i]) eligCount++;
  }
}
function conSlider(labelText, min, max, value, fmt, onInput) {
  const row = document.createElement("div");
  row.className = "constrain-row";
  row.innerHTML = "<label>" + labelText + ' <span class="val"></span></label>' +
    '<input type="range" min="' + min + '" max="' + max +
    '" step="0.01" value="' + value + '">';
  document.getElementById("cons-sliders").appendChild(row);
  const val = row.querySelector(".val");
  const inp = row.querySelector("input");
  val.textContent = fmt(value);
  inp.addEventListener("input", e => {
    val.textContent = fmt(+e.target.value);
    onInput(parseFloat(e.target.value));
  });
  return { input: inp, show: v => { val.textContent = fmt(v); } };
}
// a slider sitting at its no-op end reads "off", so "no constraint" is
// distinguishable from "constrained at the data maximum"
const atEnd = (v, end) => Math.abs(v - end) < 1e-9;
let chromaSl, LloSl, LhiSl;
function buildConsSliders() {
  chromaRange = [
    Math.floor(Math.min(...DATA.map(d => d.mean_chroma)) * 100) / 100,
    Math.ceil(Math.max(...DATA.map(d => d.mean_chroma)) * 100) / 100
  ];
  Lrange = [
    Math.floor(Math.min(...DATA.map(d => d.mean_L)) * 100) / 100,
    Math.ceil(Math.max(...DATA.map(d => d.mean_L)) * 100) / 100
  ];
  cons.chromaMax = chromaRange[1];
  cons.Llo = Lrange[0];
  cons.Lhi = Lrange[1];
  document.getElementById("cons-sliders").innerHTML = "";
  chromaSl = conSlider("mean chroma \u2264", chromaRange[0], chromaRange[1],
    cons.chromaMax,
    v => atEnd(v, chromaRange[1]) ? "off" : (+v).toFixed(2),
    v => { cons.chromaMax = v; computeElig(); recolor(); });
  LloSl = conSlider("mean lightness \u2265", Lrange[0], Lrange[1],
    cons.Llo,
    v => atEnd(v, Lrange[0]) ? "off" : (+v).toFixed(2),
    v => { cons.Llo = Math.min(v, cons.Lhi); computeElig(); recolor(); });
  LhiSl = conSlider("mean lightness \u2264", Lrange[0], Lrange[1],
    cons.Lhi,
    v => atEnd(v, Lrange[1]) ? "off" : (+v).toFixed(2),
    v => { cons.Lhi = Math.max(v, cons.Llo); computeElig(); recolor(); });
  computeElig();
}
function consSummary() {
  const parts = [];
  if (cons.chromaMax < chromaRange[1] - 1e-9)
    parts.push("chroma \u2264 " + cons.chromaMax.toFixed(2));
  if (cons.Llo > Lrange[0] + 1e-9 || cons.Lhi < Lrange[1] - 1e-9)
    parts.push("L \u2208 [" + cons.Llo.toFixed(2) + ", " + cons.Lhi.toFixed(2) + "]");
  return parts.join(" \u00b7 ");
}
function setConsSliders() {
  chromaSl.input.value = cons.chromaMax; chromaSl.show(cons.chromaMax);
  LloSl.input.value = cons.Llo; LloSl.show(cons.Llo);
  LhiSl.input.value = cons.Lhi; LhiSl.show(cons.Lhi);
}
function clearConstraints() {
  cons.chromaMax = chromaRange[1];
  cons.Llo = Lrange[0];
  cons.Lhi = Lrange[1];
  setConsSliders();
  computeElig();
  recolor();
}
document.getElementById("btn-clear-cons")
  .addEventListener("click", clearConstraints);

for (const dim of ["x", "y", "z"]) {
  const sel = document.getElementById("ax-" + dim);
  for (const a of AXES) {
    const o = document.createElement("option");
    o.value = a; o.textContent = AXIS_LABEL[a];
    sel.appendChild(o);
  }
  sel.value = currentAxes[dim];
  sel.addEventListener("change", () => {
    const axes = {
      x: document.getElementById("ax-x").value,
      y: document.getElementById("ax-y").value,
      z: document.getElementById("ax-z").value
    };
    setAxes(axes, true);
  });
}

document.getElementById("btn-reset").addEventListener("click", () => {
  camera.position.set(2.6, 1.8, 3.2);
  controls.target.set(0, 0, 0);
});
const spinBtn = document.getElementById("btn-spin");
spinBtn.addEventListener("click", () => {
  controls.autoRotate = !controls.autoRotate;
  spinBtn.textContent = "spin: " + (controls.autoRotate ? "on" : "off");
});

function chipHTML(d, rs, rank, winner) {
  const strip = d.hex.map(h => '<div style="background:' + h + '"></div>').join("");
  return '<div class="chip' + (winner ? " winner" : "") + '" data-i="' + d.i + '">' +
    '<div class="strip">' + strip + "</div>" +
    '<div class="meta"><span>' + (winner ? "\u2605 " : "#") + rank + " \u00b7 score <b>" +
    rs.toFixed(2) + "</b></span><span>cvd <b>" + d.cvd_safe.toFixed(3) + "</b> dist <b>" +
    d.min_dist.toFixed(3) + "</b> chroma <b>" + d.mean_chroma.toFixed(2) + "</b></span></div></div>";
}

// order-invariant palette distance: mean nearest-color rgb distance, both ways
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255,
    parseInt(h.slice(5, 7), 16) / 255];
}
function paletteDist(a, b) {
  const A = a.hex.map(hexRgb), B = b.hex.map(hexRgb);
  const oneWay = (xs, ys) => {
    let sum = 0;
    for (const x of xs) {
      let m = 1e9;
      for (const y of ys) {
        const dd = Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]);
        if (dd < m) m = dd;
      }
      sum += m;
    }
    return sum / xs.length;
  };
  return (oneWay(A, B) + oneWay(B, A)) / 2;
}
const DUP_THRESHOLD = 0.10;

function renderChips(s) {
  const idx = [];
  for (let i = 0; i < N; i++) if (elig[i]) idx.push(i);
  idx.sort((a, b) => s[b] - s[a]);
  const top = [];
  for (const i of idx) {
    let dup = false;
    for (const j of top) if (paletteDist(DATA[i], DATA[j]) < DUP_THRESHOLD) { dup = true; break; }
    if (!dup) top.push(i);
    if (top.length === 8) break;
  }
  document.getElementById("chips").innerHTML = top.length === 0
    ? '<div style="font-size:11px;color:#8b98ad;padding:6px 2px">' +
      "no draws match the current constraints</div>"
    : top.map((i, r) => chipHTML(
        DATA[i],
        rawScoreRange[0] + s[i] * (rawScoreRange[1] - rawScoreRange[0]),
        r + 1, r === 0)).join("");
  document.querySelectorAll(".chip").forEach(el => {
    el.addEventListener("click", () => showDetail(+el.dataset.i));
  });
}

const tooltip = document.getElementById("tooltip");
const detail = document.getElementById("detail");
const raycaster = new THREE.Raycaster();
raycaster.params.Points.threshold = 0.03;
let mouse = null;
let hoverI = -1;
let pinnedI = -1;

renderer.domElement.addEventListener("pointermove", e => {
  mouse = {
    x: (e.clientX / innerWidth) * 2 - 1,
    y: -(e.clientY / innerHeight) * 2 + 1
  };
  tooltip.style.left = e.clientX + 16 + "px";
  tooltip.style.top = e.clientY + 10 + "px";
});
renderer.domElement.addEventListener("pointerdown", () => {
  controls.autoRotate = false;
  spinBtn.textContent = "spin: off";
});
renderer.domElement.addEventListener("click", () => {
  if (hoverI >= 0) showDetail(hoverI);
  else hideDetail();
});
function showDetail(i) {
  pinnedI = i;
  spotRing.visible = true;
  const d = DATA[i];
  const strip = d.hex.map(h => '<div style="background:' + h + '"></div>').join("");
  detail.style.display = "block";
  detail.innerHTML = "<b>palette " + (i + 1) + "</b> (chain " + d.chain +
    ", draw " + d.draw + ")" + (PARETO.indexOf(i) >= 0 ? ' <span style="color:#ffd166">\u25cb Pareto</span>' : "") +
    '<div class="strip">' + strip + "</div>" +
    '<div class="hexes">' + d.hex.map(h => '<span style="color:' + h + '">\u25a0</span> ' + h).join("<br>") + "</div>" +
    '<div class="meta" style="font-size:10px;color:#8b98ad;margin-top:6px">' +
    "min dist " + d.min_dist.toFixed(3) + " \u00b7 cvd " + d.cvd_safe.toFixed(3) +
    " \u00b7 deutan " + d.min_deutan.toFixed(3) + " \u00b7 protan " + d.min_protan.toFixed(3) +
    " \u00b7 tritan " + d.min_tritan.toFixed(3) + "<br>chroma " + d.mean_chroma.toFixed(3) +
    " \u00b7 L spread " + d.lightness_spread.toFixed(3) + "</div>" +
    '<button style="margin-top:8px" onclick="hideDetail()">close</button>';
  recolor();
}
function hideDetail() {
  pinnedI = -1;
  spotRing.visible = false;
  detail.style.display = "none";
  recolor();
}
window.hideDetail = hideDetail;

function updateHover() {
  if (!mouse) return;
  raycaster.setFromCamera({ x: mouse.x, y: mouse.y }, camera);
  const hits = raycaster.intersectObject(points);
  // ineligible (ghosted) draws are not interactive: they read as filtered
  // out, and hovering/pinning them would contradict that
  if (hits.length && hits[0].index < N && elig[hits[0].index]) {
    hoverI = hits[0].index;
    const d = DATA[hoverI];
    tooltip.style.display = "block";
    tooltip.innerHTML = '<div class="strip">' +
      d.hex.map(h => '<div style="background:' + h + '"></div>').join("") +
      "</div>cvd " + d.cvd_safe.toFixed(3) + " \u00b7 dist " + d.min_dist.toFixed(3);
  } else {
    hoverI = -1;
    tooltip.style.display = "none";
  }
}

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------------------------------------------------------------- loop
function animate(t) {
  requestAnimationFrame(animate);
  if (animT < 1) {
    animT = Math.min(1, animT + 0.025);
    const e = easeInOut(animT);
    for (let i = 0; i < positions.length; i++) {
      positions[i] = froms[i] + (targets[i] - froms[i]) * e;
    }
    geometry.attributes.position.needsUpdate = true;
  }
  syncPareto();
  if (spotRing.visible && pinnedI >= 0) {
    spotRing.position.set(positions[pinnedI * 3], positions[pinnedI * 3 + 1],
      positions[pinnedI * 3 + 2]);
    const p = 0.20 + 0.035 * Math.sin((t || 0) / 180);
    spotRing.scale.set(p, p, 1);
  }
  controls.update();
  projectLabels();
  updateHover();
  renderer.render(scene, camera);
}

// URL-parameter scripting (reproducible viewpoints for reports/tests):
//   ?axes=min_dist,cvd_safe,mean_chroma & w=2,1,1,0.5 & cam=35,25,4.4 & spin=0
// Runs after loadData; changing axes/weights therefore re-applies them on
// top of the loaded sample.
function applyUrlParams() {
  const qs = new URLSearchParams(location.search);
  let axesChanged = false, wChanged = false;
  const ax = qs.get("axes");
  if (ax) {
    const parts = ax.split(",");
    if (parts.length === 3 && parts.every(p => AXES.includes(p))) {
      currentAxes = { x: parts[0], y: parts[1], z: parts[2] };
      axesChanged = true;
      for (const dim of ["x", "y", "z"]) {
        document.getElementById("ax-" + dim).value = currentAxes[dim];
      }
    }
  }
  const wq = qs.get("w");
  if (wq) {
    const parts = wq.split(",").map(Number);
    if (parts.length === 4 && parts.every(v => isFinite(v))) {
      WEIGHTED.forEach((m, i) => {
        weights[m] = parts[i];
        const el = document.getElementById("w-" + m);
        if (el) el.value = String(parts[i]);
        const vl = document.getElementById("wval-" + m);
        if (vl) vl.textContent = parts[i].toFixed(1);
      });
      wChanged = true;
    }
  }
  const cam = qs.get("cam");
  if (cam) {
    const parts = cam.split(",").map(Number);
    if (parts.length === 3 && parts.every(v => isFinite(v))) {
      const az = parts[0] * Math.PI / 180;
      const elv = parts[1] * Math.PI / 180;
      const r = parts[2];
      camera.position.set(
        r * Math.cos(elv) * Math.sin(az),
        r * Math.sin(elv),
        r * Math.cos(elv) * Math.cos(az)
      );
      controls.target.set(0, 0, 0);
    }
  }
  if (qs.get("spin") === "0") {
    controls.autoRotate = false;
    const b = document.getElementById("btn-spin");
    if (b) b.textContent = "spin: off";
  }
  // constraints: ?c=<chroma max> and ?L=<lo>,<hi>
  const cq = qs.get("c");
  if (cq !== null && isFinite(+cq)) {
    cons.chromaMax = Math.max(chromaRange[0], Math.min(chromaRange[1], +cq));
  }
  const Lq = qs.get("L");
  if (Lq) {
    const p = Lq.split(",").map(Number);
    if (p.length === 2 && p.every(v => isFinite(v))) {
      cons.Llo = Math.max(Lrange[0], Math.min(Lrange[1], p[0]));
      cons.Lhi = Math.max(cons.Llo, Math.min(Lrange[1], p[1]));
    }
  }
  if (cq !== null || Lq) { setConsSliders(); computeElig(); }
  if (axesChanged) setAxes(currentAxes, false);
  if (axesChanged || wChanged) recolor();
  const pin = qs.get("pin");
  if (pin !== null && DATA[+pin]) showDetail(+pin);
}

// ---------------------------------------------------------------- init
// Install (or replace) a posterior sample: buffers, caches, Pareto front,
// constraint ranges, chips. Called once here and again whenever the Shiny
// palette-studio app streams in a freshly sampled posterior.
function loadData(data) {
  DATA = data;
  N = DATA.length;
  for (const k in scaledCache) delete scaledCache[k];
  pinnedI = -1;
  spotRing.visible = false;
  detail.style.display = "none";
  computePareto();
  document.getElementById("pareto-n").textContent = PARETO.length;
  rebuildCloud();
  targets = new Float32Array(N * 3);
  froms = new Float32Array(N * 3);
  buildConsSliders();
  setAxes(currentAxes, false);
  recolor();
}

loadData(DATA);
applyUrlParams();
animate();

// Shiny palette-studio wiring: the server re-samples the posterior with
// user-supplied parameters (beta, targets, locked colors, ...) and streams
// replacement draws in the same shape as the embedded DATA
if (window.Shiny) {
  Shiny.addCustomMessageHandler("manifoldData", function(msg) {
    // Shiny may deliver the payload pre-parsed (object) or as a JSON string
    // depending on version/size -- accept both
    const draws = typeof msg.payload === "string"
      ? JSON.parse(msg.payload) : msg.payload;
    loadData(draws);
    if (msg.subtitle) {
      document.querySelector("#controls .sub").textContent = msg.subtitle;
      document.title = "huerd palette studio" + msg.subtitle;
    }
    const st = document.getElementById("studio-status");
    if (st) st.textContent = "idle";
  });
  Shiny.addCustomMessageHandler("manifoldStatus", function(msg) {
    const st = document.getElementById("studio-status");
    if (st) st.textContent = msg;
  });
}

// headless self-test: load with ?selftest and read document.title
if (location.search.indexOf("selftest") >= 0) {
  const results = [];
  const s = scores();
  results.push("data:" + (DATA.length === 1200));
  results.push("hex:" + DATA.every(d => d.hex.length === 6 &&
    d.hex.every(h => /^#[0-9A-F]{6}$/.test(h))));
  results.push("scores:" + (Math.max(...s) === 1 && Math.min(...s) >= 0));
  const chips = document.querySelectorAll(".chip");
  let orderOK = chips.length === 8;
  const sArr = Array.from(s);
  orderOK = orderOK && +chips[0].dataset.i === sArr.indexOf(Math.max(...sArr));
  results.push("chips:" + orderOK);
  const carpetVerts = carpet.geometry.attributes.position.count;
  results.push("carpet:" + (carpetVerts === 48 * 48));
  // Pareto front exists and is a small subset of all draws
  results.push("pareto:" + (PARETO.length > 0 && PARETO.length < N));
  // top-8 chips are pairwise distinct palettes
  const chipIs = Array.from(document.querySelectorAll(".chip")).map(el => +el.dataset.i);
  let dup = false;
  for (let a = 0; a < chipIs.length && !dup; a++)
    for (let b = a + 1; b < chipIs.length && !dup; b++)
      if (paletteDist(DATA[chipIs[a]], DATA[chipIs[b]]) < DUP_THRESHOLD) dup = true;
  results.push("dedupe:" + (chipIs.length === 8 && !dup));
  // selection link: pinning spotlights the draw in the cloud
  showDetail(0);
  results.push("spot:" + (pinnedI === 0 && spotRing.visible));
  hideDetail();
  // simulate a weight change through the slider event path
  const slider = document.getElementById("w-mean_chroma");
  slider.value = "3";
  slider.dispatchEvent(new Event("input"));
  const s2 = scores();
  results.push("reweight:" + (document.getElementById("wval-mean_chroma").textContent === "3.0"));
  // axis switch retargets positions and renames the DOM axis labels
  setAxes({ x: "pc1", y: "pc2", z: "pc3" }, false);
  results.push("axes:" + (Math.abs(targets[0] - normAxis("pc1")[0]) < 1e-6));
  results.push("labels:" + (axEls.x.textContent.indexOf("PC1") >= 0 &&
    axEls.y.textContent.indexOf("PC2") >= 0));
  // weighted score is usable as an axis
  setAxes({ x: "score", y: "cvd_safe", z: "mean_chroma" }, false);
  results.push("scoreax:" + (Math.abs(targets[0] - normAxis("score")[0]) < 1e-6));
  setAxes({ x: "min_dist", y: "cvd_safe", z: "mean_chroma" }, false);
  // constraints filter the ranked list and dim ineligible points
  cons.chromaMax = (chromaRange[0] + chromaRange[1]) / 2;
  computeElig();
  recolor();
  const chipEls = document.querySelectorAll(".chip");
  const chipOk = chipEls.length > 0 && Array.from(chipEls).every(
    el => DATA[+el.dataset.i].mean_chroma <= cons.chromaMax + 1e-9);
  results.push("cons:" + (eligCount < N && chipOk));
  clearConstraints();
  results.push("consoff:" +
    (document.querySelector("#cons-sliders .val").textContent === "off"));
  // sample replacement (the Shiny studio loop): loadData on a different
  // draw set must rebuild buffers, Pareto front, constraint ranges, chips
  const orig = DATA;
  loadData(orig.filter((_, k) => k % 2 === 0));
  const reloadOK = N === 600 &&
    document.getElementById("elig-n").textContent.indexOf("600") >= 0 &&
    document.querySelectorAll(".chip").length === 8 &&
    PARETO.length > 0 && PARETO.length < N;
  results.push("reload:" + reloadOK);
  loadData(orig);
  document.title = "SELFTEST " + results.join(" ");
}
</script>
